<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 30 1100 190" width="1100" height="190">
  <!-- White background -->
  <rect x="20" y="30" width="1100" height="190" fill="#fff"/>

  <!-- Customer Azure Container -->
  <rect x="30" y="40" width="380" height="170" fill="#fff" stroke="#999" stroke-width="1" rx="5"/>
  <text x="210" y="65" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">
    Customer Azure infrastructure
  </text>

  <!-- Customer VNet -->
  <rect x="50" y="90" width="140" height="100" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="120" y="145" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000">Customer VNet</text>

  <!-- Private Endpoint -->
  <rect x="250" y="90" width="140" height="100" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="318" y="145" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000">Private endpoint</text>

  <!-- Tigerdata Azure Container -->
  <rect x="530" y="40" width="580" height="170" fill="#fff" stroke="#999" stroke-width="1" rx="5"/>
  <text x="850" y="65" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">
    Tiger Cloud on Azure
  </text>

  <!-- Private Link Service -->
  <rect x="550" y="90" width="140" height="100" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="620" y="137" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000">Private Link</text>
  <text x="620" y="153" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000">service</text>

  <!-- Tigerdata VNet -->
  <rect x="750" y="90" width="140" height="100" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="820" y="145" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000">Tiger Cloud VNet</text>

  <!-- Timescale Database -->
  <rect x="950" y="90" width="140" height="100" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="1020" y="137" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000">Tiger Cloud</text>
  <text x="1020" y="153" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000">service</text>

  <!-- Arrows -->
  <!-- CustomerVNet to PE -->
  <path d="M 200 140 L 240 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowgray)"/>

  <!-- PE to PLS (dashed Azure Private Link) -->
  <path d="M 400 140 L 540 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowgray)"/>
  <text x="470" y="155" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000">Azure Private Link</text>
  <text x="470" y="170" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Connection</text>

  <!-- PLS to TigerVNet -->
o  <path d="M 700 140 L 740 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowgray)"/>

  <!-- TigerVNet to DB -->
  <path d="M 900 140 L 940 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowgray)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowgray" markerWidth="6" markerHeight="6" refX="4.5" refY="2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,4 L5,2 z" fill="#666" />
    </marker>
  </defs>
</svg>