name: Deploy docs to prod

on:
  push:
    branches:
      - latest

permissions: {}

jobs:
  trigger:
    name: Docs prod deploy
    runs-on: ubuntu-latest
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
        with:
          token: ${{ secrets.ORG_AUTOMATION_TOKEN }}
          repository: timescale/web-documentation
          event-type: build-docs-content-prod
  trigger-vercel:
    name: Trigger Vercel build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Webhook
        env:
          WEBHOOK_URL: ${{ secrets.VERCEL_WEBHOOK_URL }}
        run: |
          curl -X POST "$WEBHOOK_URL"
